# Détection de secrets (CI-01).
# Les identifiants de développement local et de CI sont publics par construction (conteneurs
# éphémères, jamais réutilisés ailleurs). On exempte ces VALEURS, pas des fichiers entiers :
# un vrai secret ajouté plus tard dans ci.yml ou docker-compose.yml reste détecté.
[extend]
useDefault = true

[allowlist]
description = "Identifiants de développement local et de CI"
regexes = [
  '''wishlist_app''',
  '''wishlist:wishlist@''',
  '''POSTGRES_PASSWORD:\s*wishlist''',
  # Secrets factices de session (ADR 0013) en test, en CI et dans `.env.example` : la
  # configuration de production les refuse au démarrage (`NON_PRODUCTION_SECRET`, env.ts).
  '''(test|ci-only|dev-only)-(csrf|key-hmac)-secret-0123456789abcdef''',
]
