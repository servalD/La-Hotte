# CI-05 : rapport hebdomadaire des images tierces déployées (ops/production/compose.yaml), non
# bloquant. Une vulnérabilité corrigée en amont ouvre une tâche de mise à jour ; une CVE dans
# l'image de quelqu'un d'autre n'est pas un défaut d'un changement.
#
# CI-07 : action Trivy épinglée par commit complet (même vérification que ci.yml).
name: Images tierces

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Trivy, images tierces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - caddy:2.10.2-alpine
          - postgres:17.6-bookworm
          - redis:7.4.6-alpine
          - otel/opentelemetry-collector-contrib:0.165.0
          - public.ecr.aws/zinclabs/openobserve:v1.1.2
          - glitchtip/glitchtip:7.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Trivy, image tierce
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: report.txt
          exit-code: '0'
      - name: Tâche de mise à jour si un correctif existe
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '(HIGH|CRITICAL)' report.txt; then
            title="Mettre à jour l'image $IMAGE (CI-05)"
            if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body-file report.txt
            fi
          fi
