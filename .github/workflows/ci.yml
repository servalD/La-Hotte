# CI-01 : étapes bloquantes à chaque demande de fusion. CI-02 : bout en bout sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typage, tests, contrat, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Installation verrouillée
        run: pnpm install --frozen-lockfile
      - name: Formatage
        run: pnpm format:check
      - name: Lint (dont règles d'architecture, QA-03)
        run: pnpm lint
      - name: Sentinelle d'architecture (un import interdit doit échouer)
        run: pnpm lint:architecture
      - name: Typage
        run: pnpm typecheck
      - name: Tests unitaires, contrat et non-fuite
        run: pnpm test
      - name: Tests des scripts d'exploitation (OBS-31, OBS-34)
        run: pnpm test:ops
      - name: Contrat généré à jour (API-02)
        run: pnpm generate:check
      - name: Build
        run: pnpm build
      # OBS-30 : le build ordinaire ne doit produire aucune carte servie au navigateur. Les cartes
      # ne naissent qu'au déploiement (deploy.yml), qui les envoie à GlitchTip puis les retire.
      - name: Aucune carte dans ce qui serait servi (OBS-30)
        run: node ops/observability/bundle-sourcemaps.mjs check apps/web/.next/static

  integration:
    name: Intégration (PostgreSQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: wishlist
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wishlist -d wishlist"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Identifiants éphémères du conteneur de CI, sans valeur hors de ce job.
      DATABASE_URL: postgresql://wishlist_app:wishlist_app@localhost:5432/wishlist
      DATABASE_MIGRATION_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist
      SHADOW_DATABASE_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist_shadow
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
      # Secrets de session propres à la CI (ADR 0013), sans valeur ailleurs.
      CSRF_SECRET: ci-only-csrf-secret-0123456789abcdef
      KEY_HMAC_SECRET: ci-only-key-hmac-secret-0123456789abcdef
      # « ci-only-secret-encryption-key-00 » en base64 (SEC-22), refusée en production.
      SECRET_ENCRYPTION_KEYS: 0:Y2ktb25seS1zZWNyZXQtZW5jcnlwdGlvbi1rZXktMDA=
      REGISTRATION_MODE: OPEN
      # Aucun e-mail n'est envoyé par les tests d'intégration : adresse injoignable.
      SMTP_URL: smtp://127.0.0.1:1
      MAIL_FROM: noreply@lahotte.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rôles de base (DAT-03)
        run: psql postgresql://wishlist:wishlist@localhost:5432/wishlist -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
      - name: Migrations
        run: pnpm db:migrate:deploy
      - name: Schéma Prisma et migrations concordent
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Tests d'intégration
        run: pnpm test:integration
      # OBS-26 : bloquant. Ici et non dans `quality` : les requêtes Prisma marquées ont besoin
      # d'une vraie base.
      - name: Non-fuite de la télémétrie (OBS-26)
        run: pnpm test:leak

  security:
    name: Dépendances et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Audit des dépendances
        run: pnpm audit --prod --audit-level high
      - name: Détection de secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (dépendances, configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # CI-05. L'action est épinglée par commit complet : en mars 2026 les tags de
      # aquasecurity/trivy-action ont été réécrits pour voler des secrets. Le commit a été vérifié
      # à la main (signé, dans l'historique de master, release v0.36.0). Pour monter de version :
      # refaire cette vérification, ne jamais remettre un tag. La version du binaire est fixée ici
      # plutôt que laissée au défaut de l'action, qui est plus ancien.
      - name: Trivy, dépôt (vulnérabilités des dépendances, mauvaises configurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: '**/node_modules,.git,.turbo'
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  images:
    name: Images et Trivy (CI-05, DEP-04)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: api-migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { name: web, dockerfile: apps/web/Dockerfile, target: runtime }
          - { name: fetcher, dockerfile: apps/fetcher/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Construction sans publication : la publication viendra avec le premier serveur, dans
      # deploy.yml, après ce même contrôle.
      - name: Construction de l'image
        run: >-
          docker build --file ${{ matrix.dockerfile }} --target ${{ matrix.target }}
          --tag lahotte-${{ matrix.name }}:ci .
      - name: Trivy, image (vulnérabilités de l'image construite)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: lahotte-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  restore:
    name: Sauvegarde et restauration chronométrées (DEP-05, SEC-23)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: wishlist
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wishlist -d wishlist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Identifiants éphémères du conteneur de CI, sans valeur hors de ce job.
      DATABASE_MIGRATION_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist
      OWNER_URL: postgresql://wishlist:wishlist@localhost:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Caddyfile de production valide, journaux sans chaîne de requête (OBS-20, ADM-10)
        run: |
          docker run --rm -v "$PWD/ops/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e APP_HOST=app.example.test -e OBSERVE_HOST=observe.example.test \
            -e GLITCHTIP_HOST=errors.example.test -e ACME_EMAIL=ops@example.test \
            -e OPS_ALLOWED_IPS=192.0.2.0/24 \
            caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate > caddy.json
          grep -q '"regexp"' caddy.json
          grep -q '"resp_headers"' caddy.json
      - name: Outils PostgreSQL 17 et age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Rôles et migrations
        run: |
          psql "$OWNER_URL/wishlist" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          pnpm db:migrate:deploy
      - name: Données d'essai
        run: psql "$OWNER_URL/wishlist" -v ON_ERROR_STOP=1 -f ops/production/scripts/ci-seed.sql
      - name: Sauvegarde chiffrée, puis restauration dans une base neuve
        run: |
          work="$(mktemp -d)"
          age-keygen -o "$work/identity.txt" 2>/dev/null
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$work/identity.txt")"
          export BACKUP_DIR="$work/backups"
          export PG_BASEBACKUP_CMD="true"
          export PG_DUMP_CMD="pg_dump $OWNER_URL/wishlist --format=custom"
          ops/production/scripts/backup.sh base
          psql "$OWNER_URL/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE restored OWNER wishlist"
          AGE_IDENTITY="$work/identity.txt" TARGET_URL="$OWNER_URL/restored"             ops/production/scripts/restore.sh "$(ls "$BACKUP_DIR"/logical-*.dump.age)"             | tee "$work/restore.log"
          echo "### Restauration (DEP-06)" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$work/restore.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Mêmes lignes avant et après
        run: |
          for db in wishlist restored; do
            psql "$OWNER_URL/$db" -At -c "SELECT (SELECT count(*) FROM account) || ' ' || (SELECT count(*) FROM product) || ' ' || (SELECT count(*) FROM audit_log)"
          done | uniq | wc -l | grep -qx 1

  e2e:
    name: Bout en bout (CI-02)
    if: github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wishlist/web exec playwright install --with-deps chromium
      - run: pnpm --filter @wishlist/web build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
