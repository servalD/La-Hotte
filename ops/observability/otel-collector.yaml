# Collecteur OpenTelemetry (OBS-44). Reçoit l'OTLP des applications, exporte vers OpenObserve.
# Développement local uniquement : identifiants de dev, jamais réutilisés ailleurs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch: {}

  # OBS-22 : seconde barrière, après `apps/api/src/platform/telemetry/scrub.ts` et
  # `apps/web/src/lib/telemetry/scrub.ts`. Les trois listes (OBS-29) doivent rester alignées.
  attributes/scrub:
    actions:
      - {
          pattern: '^(url\.(full|query|path|fragment)|http\.(url|target|client_ip|user_agent))$',
          action: delete,
        }
      - { pattern: '^(db\.query\.text|db\.statement|db\.query\.parameter\..*)$', action: delete }
      - { pattern: '^exception\..*$', action: delete }
      - {
          pattern: '^(client\.(address|port)|network\.peer\.(address|port)|net\.peer\.ip|user_agent\.original)$',
          action: delete,
        }
      - { pattern: '^(enduser\..*|user\.(id|name|full_name|email))$', action: delete }
      # Next : copie du nom de span d'origine, qui contient l'URL résolue (OBS-21).
      - { pattern: '^next\.span_name$', action: delete }
      - {
          pattern: '^(http\.(request|response)\.(header\..*|body.*)|rpc\.(request|response)\.metadata\..*|messaging\.message\.body.*|gen_ai\.(prompt|completion|input|output).*)$',
          action: delete,
        }
  resource/scrub:
    attributes:
      - { key: process.command, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.command_line, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: process.owner, action: delete }
      - { key: host.name, action: delete }
      - { key: host.id, action: delete }
      - { key: host.ip, action: delete }
      - { key: host.mac, action: delete }
  # Pas d'événement `exception` sur les spans, pas de message de statut (OBS-29), pas de
  # `trace_state` (texte libre venu de l'en-tête `tracestate` du client, test OBS-26). OTTL n'a pas
  # de contexte pour les liens de span : leur `trace_state` n'est retiré que par l'API
  # (`TraceParentOnlyPropagator` à l'entrée, `scrubSpanContext` à l'export).
  filter/exception-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'name == "exception"'
  transform/status-message:
    error_mode: ignore
    trace_statements:
      - 'set(span.status.message, "")'
      - 'set(span.trace_state, "")'
      # Next nomme ses spans d'après l'URL résolue : pas de chaîne de requête ni de fragment.
      - 'replace_pattern(span.name, "[?#].*$", "")'

  # OBS-22, OBS-29 : mêmes clés interdites sur les attributs des événements de span, que
  # `attributes/scrub` ne voit pas (il ne traite que les attributs du span). `propagate` : en cas
  # d'erreur d'exécution, le lot est abandonné plutôt que transmis sans nettoyage. Garder le motif
  # aligné sur `attributes/scrub` ci-dessus.
  transform/spanevent-scrub:
    error_mode: propagate
    trace_statements:
      - >-
        delete_matching_keys(spanevent.attributes,
        "^(url[.](full|query|path|fragment)|http[.](url|target|client_ip|user_agent)|db[.]query[.]text|db[.]statement|db[.]query[.]parameter[.].*|exception[.].*|client[.](address|port)|network[.]peer[.](address|port)|net[.]peer[.]ip|user_agent[.]original|enduser[.].*|user[.](id|name|full_name|email)|next[.]span_name|http[.](request|response)[.](header[.].*|body.*)|rpc[.](request|response)[.]metadata[.].*|messaging[.]message[.]body.*|gen_ai[.](prompt|completion|input|output).*)$")

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      # base64("dev@example.com:Dev-Obs-1!") ; voir docker-compose.yml
      Authorization: Basic ZGV2QGV4YW1wbGUuY29tOkRldi1PYnMtMSE=

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          resource/scrub,
          attributes/scrub,
          filter/exception-events,
          transform/status-message,
          transform/spanevent-scrub,
          batch,
        ]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/scrub, attributes/scrub, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/scrub, attributes/scrub, batch]
      exporters: [otlphttp/openobserve]
